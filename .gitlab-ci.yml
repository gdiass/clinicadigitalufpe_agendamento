default:
  image: node:24-alpine
  before_script:
    - apk add --no-cache openssl
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - cp .env.example .env

stages:
  - test
  - mirror

variables:
  POSTGRES_DB: appstart_test
  POSTGRES_USER: appstart
  POSTGRES_PASSWORD: appstart_ci_password
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://appstart:appstart_ci_password@postgres:5432/appstart_test?schema=public

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

validate-and-test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres

  script:
    - pnpm install --frozen-lockfile
    - pnpm run typecheck
    - pnpm db:migrate
    - pnpm run test
    - pnpm --dir apps/api test:e2e

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

require-approval:
  stage: test
  before_script: []
  cache: []
  script:
    - node scripts/check-mr-approval.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

mirror-to-github:
  stage: mirror
  before_script:
    - apk add --no-cache git
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_REPOSITORY" ]; then
        echo "Configure as variáveis GITHUB_TOKEN e GITHUB_REPOSITORY no GitLab."
        exit 1
      fi
    - git clone --bare "$CI_REPOSITORY_URL" repository-mirror
    - >
      git -C repository-mirror push --prune
      "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_REPOSITORY'
    - when: never
